name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --locked --dev
      - run: cd apps/api && uv run pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages/shared
