[project]
name = "thai-food-api"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "Flask==2.0.0",
    "Flask-Cors==3.0.10",
    "huggingface_hub>=0.21.0",
    "keras==2.11.0",
    "Keras-Preprocessing==1.1.2",
    "numpy==1.23.5",
    "pymongo==4.3.3",
    "python-dotenv==0.21.0",
    "requests==2.26.0",
    "tensorflow==2.11.0",
    "pillow==9.3.0",
    "Werkzeug==2.0.3",
    "Jinja2==3.0.3",
    "itsdangerous==2.0.1",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-flask==1.3.0",
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml"
pythonpath = ["."]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
